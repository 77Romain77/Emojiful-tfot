name: Build Emojiful 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Forge mod JAR
        run: ./gradlew :Forge:reobfShadowJar -PforgeOnly --stacktrace

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: Emojiful-1.20.1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Forge/build/libs/*.jar
            !Forge/build/libs/*-sources.jar
            !Forge/build/libs/*-javadoc.jar
