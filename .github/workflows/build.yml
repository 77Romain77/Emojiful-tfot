name: Build Emojiful 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Twemoji metadata and images
        uses: actions/checkout@v4
        with:
          repository: iamcal/emoji-data
          ref: 097705020bcf82331c9ef10df3425aad15f5043c
          path: _emoji_sources/emoji-data

      - name: Checkout Emojiful custom assets
        uses: actions/checkout@v4
        with:
          repository: InnovativeOnlineIndustries/emojiful-assets
          ref: 2f43350cfe872e3c66716cffa9dd7d8d3132e757
          path: _emoji_sources/emojiful-assets

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Forge mod JAR
        run: ./gradlew :Forge:reobfShadowJar -PforgeOnly --stacktrace

      - name: Install local emoji pack generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Build client local emoji pack
        run: >-
          python tools/generate_local_emoji_pack.py
          --emoji-data _emoji_sources/emoji-data
          --custom-assets _emoji_sources/emojiful-assets
          --output buildOutput/TFOT-Emojiful-Local-Emojis-1.20.1.zip

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: Emojiful-1.20.1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Forge/build/libs/*.jar
            !Forge/build/libs/*-sources.jar
            !Forge/build/libs/*-javadoc.jar

      - name: Upload client local emoji pack
        uses: actions/upload-artifact@v4
        with:
          name: TFOT-Emojiful-Local-Emojis-1.20.1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: buildOutput/TFOT-Emojiful-Local-Emojis-1.20.1.zip
